[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsq"
version = "0.1.0"
description = "Gumbel Softmax Quantization for large language models"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "transformers",
    "accelerate",
    "datasets",
    "safetensors",
    "compressed-tensors",
    "lion-pytorch",
    "wandb",
    "tqdm",
    "pyyaml",
    "python-dotenv",
    "tiktoken",
    "lm-eval[api]",
    "lighteval",
    # Keep torch/torchvision pinned for vLLM 0.20.x compatibility.
    # vLLM is pinned to 0.20.2 and resolved from PyPI.
    "torch==2.11.0",
    "torchvision==0.26.0",
    "vllm==0.20.2",
    "ray",
    "ninja"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Pin torch (and friends) to the PyTorch CUDA wheel index ────────────────
# Current default is cu128 to match this machine's driver ceiling.
# Note: vLLM >=0.20 introduces humming, but official wheels may depend on
# CUDA 13 runtime (libcudart.so.13). On cu128-only hosts, prefer building
# vLLM from source against CUDA 12.8 instead of using incompatible wheels.
# To target a different CUDA version, override index URL at command line, e.g.:
#   UV_INDEX_PYTORCH=https://download.pytorch.org/whl/cu128 uv sync
# and keep TORCH_CUDA in scripts/setup_env.sh aligned with this index.
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
# Use PyPI official wheel source for vLLM.
# Note: vLLM 0.20.x on PyPI publishes generic manylinux wheels, not +cu128 URLs.

