# ============================================================
# Marvis Agent 框架默认配置
# 此文件随版本更新覆盖，用户自定义配置请放在用户配置目录中
# ============================================================

# --- 框架基础配置 ---
framework:
  log_level: "INFO"                # 日志级别: DEBUG / INFO / WARNING / ERROR
  log_stdout: false                # 是否同时输出到控制台
  debug_http: false                # 是否启用 HTTP 调试（注入 debug 客户端）
  memory_log_level: "INFO"        # 记忆模块专用日志级别: DEBUG / INFO / WARNING / ERROR

# --- 执行引擎配置 ---
execution:
  tool_timeout_s: 600              # 普通工具执行超时（秒）
  max_iterations: 25               # Agent 单次运行最大迭代次数（全局默认值，可被 Agent Profile 覆盖）
  max_nesting_depth: 3             # 子 Agent 最大嵌套深度
  scheduled_task_max_concurrent_runs: 3  # 定时任务最大同时运行数
  scheduled_task_lease:
    enabled: true                 # 是否启用定时任务云端租约
    base_url: "https://yybadaccess.3g.qq.com"  # 租约接入层地址
    acquire_path: "/v3/marvis_scheduled_task_lease_acquire"  # 获取租约路径
    release_path: "/v3/marvis_scheduled_task_lease_release"  # 释放租约路径
    timeout: 10                    # 租约接口请求超时（秒）
    businessid: "marvis_client"    # 租约业务 ID（Ual-Access 鉴权用）
    appid: "102033112"             # 租约应用 ID（Ual-Access 鉴权用）
    accesskey: "fpzkeTlcGLVP37qiOWd29MyaOqaJYxMi"  # 租约访问密钥（MD5 签名用）
    max_wait_seconds: 3600         # 最大等待租约时长，0 表示不限制
    retry_after_min_seconds: 10    # 服务端建议重试间隔下限（秒）
    retry_after_max_seconds: 60    # 服务端建议重试间隔上限（秒）
    retry_jitter_seconds: 3        # 重试随机抖动上限（秒）

# --- 模型注册表 ---
# 从 V1 registries/models.yaml 完整迁移，provider 已按 V2 规范修正：
#   - V1 的 provider: deepseek / venus 统一改为 provider: openai（OpenAI 兼容协议）
#   - V1 的 provider: anthropic 保持不变
#   - 未指定 provider 时默认为 openai
#
# 每个模型的配置结构由 LLMClientFactory 消费，此处不做内部校验
# 必填字段: model（模型标识符）
# 可选字段: provider / api_key / base_url / temperature / max_tokens / context_window_tokens /
#           thinking / extra_body / default_headers / max_retries / timeout /
#           strip_leading_whitespace / include_stream_usage / usage_merge_strategy
#
# 字段说明:
#   provider: openai（默认）| anthropic
#   context_window_tokens(必填): 模型上下文窗口大小（token 数），用于记忆模块判断上下文容量上限，快到上下文上限时触发压缩，默认 128000，如果不配置会导致压缩判断错误
#   max_tokens(必填): 模型最大 输出token 数（用于记忆模块判断压缩时下一轮需要预留的上下文），默认 8000，如果不配置会导致压缩判断错误
#   strip_leading_whitespace: 去除流式输出头部空白（默认 true）
#   include_stream_usage: 流式请求中包含 usage 统计（默认 true）
#   usage_merge_strategy: usage 合并策略 - latest（默认）| accumulate
#   thinking: Anthropic thinking 参数（如 {type: adaptive, effort: high}）
#   extra_body: 额外请求体参数（如 {thinking_enabled: true}）
#   default_headers: 默认请求头
#   max_retries: SDK 级别最大重试次数（默认 2）
#   timeout: 请求超时配置，支持两种格式：
#     - 简写（数字）: timeout: 600  → connect=10, read=600, write=600, pool=600
#     - 完整（字典）: timeout: {connect: 10, read: 600, write: 600, pool: 600}
#       connect: TCP 连接建立超时（默认 10 秒）
#       read: chunk 间隔超时，流式场景下两个 chunk 之间的最大等待（默认 600 秒）
#       write: 请求发送超时（默认 600 秒）
#       pool: 连接池等待超时（默认 600 秒）
#
# 特殊条目:
#   local_model: 本地模型连接参数模板
#     LOCAL 模式下，当某个 Agent / 组件显式声明 allow_local_llm: true 时，
#     此模板会在运行时用于覆盖目标模型的连接参数。
#     覆盖字段：model / api_key / base_url / provider / temperature / extra_body
#     保留字段：模型自身的 context_window_tokens / max_tokens 等不在模板中的字段
#     ${LOCAL_LLM_PORT} 占位符在 AgentConfig.load() 中动态替换为实际端口
#     决策位置（均默认 false）：
#       - 主/子 Agent：prompts/agents/<name>/config.yaml 中 model.allow_local_llm
#       - 记忆压缩模型：memory.llm.allow_local_llm
#
# api_key 说明:
#   api_key 是业务标识符（非真正密钥），实际鉴权通过用户登录态完成。
#   生产环境中整个配置文件通过 EncryptFsUtil 加密存储，运行时透明读取。
models:
  # 本地模型连接参数模板（非可直接选用的模型）
  # 当 Agent / 组件显式开启 allow_local_llm 且 work_mode=LOCAL 时，
  # 运行时用此模板覆盖目标模型的连接参数
  local_model:
    model: "/data1/models/qwen36-35b-a3b-2bit-humming"
    api_key: "no-key"
    base_url: "http://29.226.67.231:8080/v1"
    provider: "openai"
