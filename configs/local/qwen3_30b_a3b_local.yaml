# Qwen3-30B-A3B-Instruct local config
# Model path: /data1/models/Qwen3-30B-A3B-Instruct-2507
# Scaling: 4 GPUs recommended, ~12h for 48 layers on H20

model:
  name: "/data1/models/Qwen3-30B-A3B-Instruct-2507"
  device: "cuda"
  dtype: "bfloat16"

data:
  dataset_name: "open_thoughts"
  batch_size: 64
  num_samples: 4096
  max_length: 4096
  num_workers: 8
  val_samples: 128

quantization:
  gsq_bits: 2
  init_method: "gptq"
  gsq_enabled: true
  start_layer: 0
  self_attn: false
  std: 0.01
  temperature: [2, 0.05]
  scale: [100, 500]
  groupsize: 128
  strength: 6
  logits_dtype: "bfloat16"

training:
  num_epochs: 5
  device_microbatch_size: 4
  lr1: 0.0002
  lr2: 0.0001
  weight_decay: 1.0
  checkpoint_dir: "checkpoints/qwen3-30b-instruct-2507"
  log_dir: "logs/qwen3-30b-instruct-2507"
  act_cache_dir: "cache/act_cache"
  eval_baseline: true

gptq:
  nsamples: 512
  wbits: 2
  sym: true
  trits: false
  percdamp: 0.1
  blocksize: 128
  groupsize: 128
  static_groups: false
  prunen: 0
  prunem: 0

wandb: false
